<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Mi Suscripción')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alertas}"></div>

<div class="main-content">
<div class="container">
    <h2 class="mb-4"><i class="bi bi-box-seam"></i> Mi Suscripción</h2>

    <div th:if="${suscripcion != null}">
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <h5>Plan Actual: <span class="badge bg-primary" th:text="${suscripcion.plan.nombre}"></span></h5>
                        <p><strong>Precio:</strong> <span th:text="${#numbers.formatDecimal(suscripcion.plan.precioMensual, 1, 2)}"></span>€/mes</p>
                        <p><strong>Estado:</strong>
                            <span class="badge"
                                  th:classappend="${suscripcion.estado.name() == 'ACTIVA' ? 'bg-success' : 'bg-danger'}"
                                  th:text="${suscripcion.estado.descripcion}"></span>
                        </p>
                    </div>
                    <div class="col-md-6">
                        <p><strong>Fecha inicio:</strong> <span th:text="${suscripcion.fechaInicio}"></span></p>
                        <p><strong>Próxima facturación:</strong> <span th:text="${suscripcion.fechaProximaFacturacion}"></span></p>
                        <ul class="list-unstyled small text-muted">
                            <li th:each="pc : ${suscripcion.plan.planCaracteristicas}" th:if="${pc.activa}">
                                <i class="bi bi-check-circle-fill text-success"></i>
                                <span th:text="${pc.caracteristica.nombre + ': ' + pc.valor}"></span>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>

        <h4>Cambiar de Plan</h4>
        <div class="row">
            <div class="col-md-4 mb-3" th:each="plan : ${planes}" th:if="${plan.id != suscripcion.plan.id}">
                <div class="card shadow-sm card-plan">
                    <div class="card-body text-center">
                        <h5 th:text="${plan.nombre}"></h5>
                        <p class="display-6 fw-bold"><span th:text="${#numbers.formatDecimal(plan.precioMensual, 1, 2)}"></span>€</p>
                        <p class="text-muted small">/mes</p>
                        <form method="post" th:action="@{/suscripcion/cambiar/{id}(id=${plan.id})}">
                            <button type="submit" class="btn w-100"
                                    th:classappend="${plan.precioMensual > suscripcion.plan.precioMensual ? 'btn-success' : 'btn-outline-secondary'}">
                                <span th:text="${plan.precioMensual > suscripcion.plan.precioMensual ? 'Upgrade' : 'Downgrade'}"></span>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${suscripcion == null}" class="text-center py-5">
        <i class="bi bi-exclamation-triangle display-3 text-warning"></i>
        <h4 class="mt-3">No tienes una suscripción activa</h4>
        <a href="/planes" class="btn btn-primary mt-2">Elegir un Plan</a>
    </div>
</div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
