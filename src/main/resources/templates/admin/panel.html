<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Admin - Panel')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alertas}"></div>

<div class="main-content">
<div class="container">
    <h2 class="mb-4"><i class="bi bi-shield-lock text-warning"></i> Panel de Administración</h2>

    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card shadow-sm bg-primary text-white">
                <div class="card-body text-center">
                    <i class="bi bi-receipt display-4"></i>
                    <h3 th:text="${totalFacturas}" class="mt-2">0</h3>
                    <p>Facturas Totales</p>
                    <a href="/admin/facturas" class="btn btn-light btn-sm">Ver Facturas</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm bg-info text-white">
                <div class="card-body text-center">
                    <i class="bi bi-clock-history display-4"></i>
                    <h3 class="mt-2">Auditoría</h3>
                    <p>Historial de cambios</p>
                    <a href="/admin/auditoria" class="btn btn-light btn-sm">Ver Auditoría</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm bg-success text-white">
                <div class="card-body text-center">
                    <i class="bi bi-lightning-charge display-4"></i>
                    <h3 class="mt-2">Facturación</h3>
                    <p>Ejecutar manualmente</p>
                    <form method="post" action="/admin/facturacion-manual">
                        <button type="submit" class="btn btn-light btn-sm"
                                onclick="return confirm('¿Ejecutar facturación automática ahora?')">
                            <i class="bi bi-play-fill"></i> Ejecutar Ahora
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
