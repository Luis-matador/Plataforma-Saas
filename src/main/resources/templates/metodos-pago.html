<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Metodos de Pago')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alertas}"></div>

<div class="main-content">
<div class="container">
    <h2 class="mb-4"><i class="bi bi-credit-card"></i> Mis Metodos de Pago</h2>

    <div class="row mb-4" th:if="${not #lists.isEmpty(metodosPago)}">
        <div class="col-md-4 mb-3" th:each="metodo : ${metodosPago}">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <h6 class="mb-1">
                                <i th:if="${metodo.tipoPago.name() == 'TARJETA'}" class="bi bi-credit-card-2-front text-primary"></i>
                                <i th:if="${metodo.tipoPago.name() == 'PAYPAL'}" class="bi bi-paypal text-info"></i>
                                <i th:if="${metodo.tipoPago.name() == 'TRANSFERENCIA'}" class="bi bi-bank text-secondary"></i>
                                <span th:text="${metodo.tipoPago.descripcion}"></span>
                            </h6>
                            <div th:if="${metodo.tipoPago.name() == 'TARJETA'}">
                                <p class="mb-0 text-muted">**** **** **** <span th:text="${metodo.numeroTarjeta}"></span></p>
                                <p class="mb-0 small text-muted" th:text="${metodo.titular}"></p>
                                <p class="mb-0 small text-muted">Exp: <span th:text="${metodo.fechaExpiracion}"></span></p>
                            </div>
                            <div th:if="${metodo.tipoPago.name() == 'PAYPAL'}">
                                <p class="mb-0 text-muted" th:text="${metodo.emailPaypal}"></p>
                            </div>
                            <div th:if="${metodo.tipoPago.name() == 'TRANSFERENCIA'}">
                                <p class="mb-0 text-muted">Cuenta: <span th:text="${metodo.numeroCuenta}"></span></p>
                                <p class="mb-0 small text-muted" th:text="${metodo.banco}"></p>
                            </div>
                        </div>
                        <form method="post" th:action="@{/metodos-pago/eliminar/{id}(id=${metodo.id})}" class="ms-2">
                            <button type="submit" class="btn btn-sm btn-outline-danger"
                                    onclick="return confirm('Eliminar este metodo de pago?')">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(metodosPago)}" class="text-center py-4 mb-4">
        <i class="bi bi-wallet2 display-4 text-muted"></i>
        <p class="text-muted mt-2">No tienes metodos de pago registrados.</p>
    </div>

    <h4 class="mb-3"><i class="bi bi-plus-circle"></i> Agregar Metodo de Pago</h4>

    <ul class="nav nav-tabs" id="paymentTabs" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="tarjeta-tab" data-bs-toggle="tab" data-bs-target="#tarjeta"
                    type="button" role="tab"><i class="bi bi-credit-card-2-front"></i> Tarjeta</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="paypal-tab" data-bs-toggle="tab" data-bs-target="#paypal"
                    type="button" role="tab"><i class="bi bi-paypal"></i> PayPal</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="transferencia-tab" data-bs-toggle="tab" data-bs-target="#transferencia"
                    type="button" role="tab"><i class="bi bi-bank"></i> Transferencia</button>
        </li>
    </ul>

    <div class="tab-content border border-top-0 rounded-bottom p-4 bg-white mb-4" id="paymentTabContent">
        <div class="tab-pane fade" th:classappend="${activeTab == 'tarjeta' or activeTab == null} ? 'show active'" id="tarjeta" role="tabpanel">
            <form method="post" action="/metodos-pago/tarjeta" th:object="${tarjetaRequest}">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="numeroTarjeta" class="form-label">Numero de tarjeta</label>
                        <input type="text" class="form-control" th:classappend="${#fields.hasErrors('numeroTarjeta')} ? 'is-invalid'"
                               id="numeroTarjeta" th:field="*{numeroTarjeta}" placeholder="1234 5678 9012 3456" maxlength="19">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('numeroTarjeta')}" th:errors="*{numeroTarjeta}"></div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="titular" class="form-label">Nombre del titular</label>
                        <input type="text" class="form-control" th:classappend="${#fields.hasErrors('titular')} ? 'is-invalid'"
                               id="titular" th:field="*{titular}" placeholder="MARCO CARDO CABALERO">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('titular')}" th:errors="*{titular}"></div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="fechaExpiracion" class="form-label">Fecha de expiracion</label>
                        <input type="text" class="form-control" th:classappend="${#fields.hasErrors('fechaExpiracion')} ? 'is-invalid'"
                               id="fechaExpiracion" th:field="*{fechaExpiracion}" placeholder="MM/YY" maxlength="5">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('fechaExpiracion')}" th:errors="*{fechaExpiracion}"></div>
                    </div>
                    <div class="col-md-8 d-flex align-items-end mb-3">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-plus-lg"></i> Agregar Tarjeta
                        </button>
                    </div>
                </div>
            </form>
        </div>

        <div class="tab-pane fade" th:classappend="${activeTab == 'paypal'} ? 'show active'" id="paypal" role="tabpanel">
            <form method="post" action="/metodos-pago/paypal" th:object="${payPalRequest}">
                <div class="row">
                    <div class="col-md-8 mb-3">
                        <label for="emailPaypal" class="form-label">Email de PayPal</label>
                        <input type="email" class="form-control" th:classappend="${#fields.hasErrors('emailPaypal')} ? 'is-invalid'"
                               id="emailPaypal" th:field="*{emailPaypal}" placeholder="tu-email@paypal.com">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('emailPaypal')}" th:errors="*{emailPaypal}"></div>
                    </div>
                    <div class="col-md-4 d-flex align-items-end mb-3">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-plus-lg"></i> Agregar PayPal
                        </button>
                    </div>
                </div>
            </form>
        </div>

        <div class="tab-pane fade" th:classappend="${activeTab == 'transferencia'} ? 'show active'" id="transferencia" role="tabpanel">
            <form method="post" action="/metodos-pago/transferencia" th:object="${transferenciaRequest}">
                <div class="row">
                    <div class="col-md-5 mb-3">
                        <label for="numeroCuenta" class="form-label">Numero de cuenta / IBAN</label>
                        <input type="text" class="form-control" th:classappend="${#fields.hasErrors('numeroCuenta')} ? 'is-invalid'"
                               id="numeroCuenta" th:field="*{numeroCuenta}" placeholder="ES12 3456 7890 1234 5678">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('numeroCuenta')}" th:errors="*{numeroCuenta}"></div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="banco" class="form-label">Banco</label>
                        <input type="text" class="form-control" th:classappend="${#fields.hasErrors('banco')} ? 'is-invalid'"
                               id="banco" th:field="*{banco}" placeholder="Nombre del banco">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('banco')}" th:errors="*{banco}"></div>
                    </div>
                    <div class="col-md-3 d-flex align-items-end mb-3">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-plus-lg"></i> Agregar
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
