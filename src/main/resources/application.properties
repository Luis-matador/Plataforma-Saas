spring.application.name=plataformaSaaS

# ==========================================
# BASE DE DATOS MySQL
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/plataformaSaas_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# ==========================================
# Hibernate Envers (Auditoría)
# ==========================================
spring.jpa.properties.org.hibernate.envers.audit_table_suffix=_AUD
spring.jpa.properties.org.hibernate.envers.store_data_at_delete=true

# ==========================================
# Facturación programada
# ==========================================
billing.scheduling.enabled=true
